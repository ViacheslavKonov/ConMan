name: CI

on:
  push:
    branches:
      - main
      - "step7/**"
  pull_request:
    branches:
      - main

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: conman
      DB_USER: conman
      DB_PASSWORD: ci_dummy
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: conman
          POSTGRES_USER: conman
          POSTGRES_PASSWORD: ci_dummy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U conman -d conman"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall -q app alembic
      - run: DB_PASSWORD=ci_dummy alembic upgrade head --sql > /tmp/conman_migrations.sql
      - run: DB_PASSWORD=ci_dummy python -c "import app.models; from sqlalchemy.orm import configure_mappers; configure_mappers(); print('SQLAlchemy models OK')"
      - run: python -m unittest discover -s tests -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run build
