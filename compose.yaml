services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-conman}
      POSTGRES_USER: ${POSTGRES_USER:-conman}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-conman} -d ${POSTGRES_DB:-conman}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    image: ${CONMAN_IMAGE_REGISTRY:-ghcr.io/viacheslavkonov}/conman-backend:${CONMAN_IMAGE_TAG:-latest}
    pull_policy: always
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_NAME: ${APP_NAME:-ConMan}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-conman}
      DB_USER: ${POSTGRES_USER:-conman}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: ${CONMAN_IMAGE_REGISTRY:-ghcr.io/viacheslavkonov}/conman-frontend:${CONMAN_IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped

  caddy:
    image: ${CONMAN_IMAGE_REGISTRY:-ghcr.io/viacheslavkonov}/conman-proxy:${CONMAN_IMAGE_TAG:-latest}
    pull_policy: always
    environment:
      APP_HOST: ${APP_HOST:-:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
